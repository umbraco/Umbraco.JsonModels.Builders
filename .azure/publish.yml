trigger:
  branches:
    include:
      - main
  tags:
    include:
      - release/*
pr: none
pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Npm@1
    displayName: 'run npm ci'
    inputs:
      command: ci
  - task: Npm@1
    displayName: 'Build'
    inputs:
      command: custom
      customCommand: run build
  # Generates BOM
  - powershell: |
      npm install --global @cyclonedx/cyclonedx-npm
      cyclonedx-npm -o $(Build.ArtifactStagingDirectory)/bom/bom-json-builders.xml --ignore-npm-errors --verbose
    displayName: Generate BOM
  # Published BOM
  - publish: $(Build.ArtifactStagingDirectory)/bom
    artifact: bom-json-builders
    displayName: 'Publish BOM'
  # Uploads BOM
  - task: upload-bom-dtrack@1
    displayName: 'Upload BOM to Dependency-Track'
    inputs:
      bomFilePath: '$(Build.ArtifactStagingDirectory)/bom/bom-json-builders.xml'
      dtrackProjName: 'Umbraco.JSONModelsBuilder'
      dtrackProjVersion: '17'
      dtrackAPIKey: $(DT_API_KEY)
      dtrackURI: $(DT_API_URL)
      dtrackProjAutoCreate: true
  # Publishes JSON Models Builder to NPM 
  - task: Npm@1
    displayName: 'Publish to npm'
    inputs:
      command: custom
      customCommand: publish --access public
      publishRegistry: useExternalRegistry
      publishEndpoint: NpmPlaywright
      customEndpoint: NpmPlaywright